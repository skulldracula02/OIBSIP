<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="card">
    <h1>Register</h1>
    <form id="regForm">
      <label>Username</label>
      <input type="text" id="username" required />
      <label>Email</label>
      <input type="email" id="email" required />
      <label>Password</label>
      <input type="password" id="password" required />
      <div id="error" class="error"></div>
      <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="index.html">Login</a></p>
  </main>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const error = document.getElementById('error');
      error.textContent = '';
      if (!username || !email || !password) { error.textContent = 'Please fill in all fields.'; return; }
      if (password.length < 8 || !/\d/.test(password)) { error.textContent = 'Password must be at least 8 characters and contain a number.'; return; }
      const res = await registerUser({ username, email, password });
      if (res.success) {
        alert('Registration successful — please login.');
        location.href = 'index.html';
      } else {
        error.textContent = res.message || 'Registration failed.';
      }
    });
  </script>
</body>
</html>
